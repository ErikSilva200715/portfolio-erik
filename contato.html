
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erik da Silva Santos - CONTATO</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="cabecalho">
        <nav class="cabecalho_menu">
            <a class="cabecalho_menu_links" href="index.html">HOME</a>
            <a class="cabecalho_menu_links" href="case.html">TRABALHO</a>
            <a class="cabecalho_menu_links" href="about.html">QUEM SOU</a>
            <a class="cabecalho_menu_links" href="contato.html">CONTATO</a>
        </nav>
    </header>

    <main class="contato">
        <h1 class="apresentacao_conteudo_titulo">
            Entre em <strong class="titulo_destaque">contato</strong>
        </h1>

        <p class="apresentacao_conteudo_texto">
            Tem um projeto em mente ou quer bater um papo?
            Preencha o formulário que eu respondo o mais rápido possível.
        </p>

        <form class="formulario"
              action="https://formsubmit.co/lollembre@gmail.com"
              method="POST">

            <input type="hidden" name="_subject"
                   value="Novo contato pelo portfólio">

            <input type="hidden" name="_captcha" value="false">

            <label for="nome">Nome</label>
            <input type="text" id="nome" name="nome"
                   placeholder="Seu nome completo" required>

            <label for="email">E-mail</label>
            <input type="email" id="email" name="email"
                   placeholder="seuemail@exemplo.com" required>

            <label for="assunto">Assunto</label>
            <select id="assunto" name="assunto">
                <option>Proposta de projeto</option>
                <option>Oportunidade de estágio</option>
                <option>Dúvida</option>
                <option>Outro</option>
            </select>

            <label for="mensagem">Mensagem</label>
            <textarea id="mensagem" name="mensagem"
                      rows="6"
                      placeholder="Escreva sua mensagem aqui"
                      required></textarea>

            <div class="formulario_botoes">
                <button type="reset"
                        class="botao botao_secundario">
                    Limpar
                </button>

                <button type="submit" class="botao">
                    Enviar
                </button>
            </div>
        </form>
    </main>

    <footer class="rodape">
        <p>Todos os direitos reservados Erik da Silva Santos © 2026 | FEMA</p>
    </footer>
</body>
</html>
